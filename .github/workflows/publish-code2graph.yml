name: Publish to code2graph repo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to sergey-frolov-pets/code2graph
        env:
          GH_PAT: ${{ secrets.CODE2GRAPH_PUBLISH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "Missing secret CODE2GRAPH_PUBLISH_PAT"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add code2graph "https://x-access-token:${GH_PAT}@github.com/sergey-frolov-pets/code2graph.git"
          git push code2graph HEAD:main --force
