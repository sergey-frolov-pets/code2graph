name: Publish to code2graph repo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish mirror to code2graph
        env:
          GH_PAT: ${{ secrets.CODE2GRAPH_PUBLISH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "CODE2GRAPH_PUBLISH_PAT is not set — skipping publish to code2graph."
            echo "Add the secret in vuePUML repo settings, then re-run this workflow."
            exit 0
          fi

          rm -rf publish/
          rm -f scratchpad.md netlify.toml
          rm -f scripts/migrate-to-code2graph.mjs
          rm -f docs/diagram-converter-plan.md docs/REFACTORING.md
          rm -f .github/workflows/publish-code2graph.yml
          rm -f .github/workflows/publish-ozadachnik.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: strip obsolete files for code2graph mirror [skip ci]"
          fi

          git remote add code2graph "https://x-access-token:${GH_PAT}@github.com/sergey-frolov-pets/code2graph.git"
          git push code2graph HEAD:main --force
