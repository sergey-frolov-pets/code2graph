name: Publish Ozadachnik to dedicated repo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ozadachnik-initial branch
        uses: actions/checkout@v4
        with:
          ref: ozadachnik-initial
          fetch-depth: 0

      - name: Push to sergey-frolov-pets/ozadachnik
        env:
          GH_PAT: ${{ secrets.OZADACHNIK_PUBLISH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "Missing secret OZADACHNIK_PUBLISH_PAT"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add ozadachnik "https://x-access-token:${GH_PAT}@github.com/sergey-frolov-pets/ozadachnik.git"
          git push ozadachnik HEAD:main --force
