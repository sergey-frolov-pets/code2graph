services:
  code2graph:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - path: server/.env
        required: false
    environment:
      PORT: "3001"
      DB_PATH: /data/library.db
      STATIC_DIR: /app/dist
      DEPLOYMENT_API_BASE_URL: /api
    volumes:
      - code2graph-data:/data

volumes:
  code2graph-data:
