<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Code2Graph</title>
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, "") || "/";
        if (path.toLowerCase() === "/diagram") {
          location.replace("/?/diagram");
          return;
        }
        var match = path.match(/\/local\/([a-z0-9]+(?:-[a-z0-9]+)*)$/i);
        if (match) {
          location.replace("/?/local/" + match[1].toLowerCase());
          return;
        }
        var reserved = { local: 1, diagram: 1, api: 1, assets: 1, icons: 1, fonts: 1, vendor: 1 };
        var parts = path.split("/").filter(Boolean);
        if (parts.length !== 2 && parts.length !== 3) {
          location.replace("/#/");
          return;
        }
        if (reserved[parts[0].toLowerCase()]) {
          location.replace("/#/");
          return;
        }
        var encoded = parts.map(function (part) {
          try {
            return encodeURIComponent(decodeURIComponent(part));
          } catch (error) {
            return "";
          }
        });
        if (encoded.some(function (part) { return !part; })) {
          location.replace("/#/");
          return;
        }
        location.replace("/?/" + encoded.join("/"));
      })();
    </script>
  </head>
  <body></body>
</html>
