<svg id="mermaid-render-7" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 194px;" viewBox="-5 -27 194 54" role="graphics-document document" aria-roledescription="block"><style>#mermaid-render-7{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-render-7 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-render-7 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-render-7 .error-icon{fill:#552222;}#mermaid-render-7 .error-text{fill:#552222;stroke:#552222;}#mermaid-render-7 .edge-thickness-normal{stroke-width:1px;}#mermaid-render-7 .edge-thickness-thick{stroke-width:3.5px;}#mermaid-render-7 .edge-pattern-solid{stroke-dasharray:0;}#mermaid-render-7 .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-render-7 .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-render-7 .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-render-7 .marker{fill:#333333;stroke:#333333;}#mermaid-render-7 .marker.cross{stroke:#333333;}#mermaid-render-7 svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-render-7 p{margin:0;}#mermaid-render-7 .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#mermaid-render-7 .cluster-label text{fill:#333;}#mermaid-render-7 .cluster-label span,#mermaid-render-7 p{color:#333;}#mermaid-render-7 .label text,#mermaid-render-7 span,#mermaid-render-7 p{fill:#333;color:#333;}#mermaid-render-7 .node rect,#mermaid-render-7 .node circle,#mermaid-render-7 .node ellipse,#mermaid-render-7 .node polygon,#mermaid-render-7 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#mermaid-render-7 .flowchart-label text{text-anchor:middle;}#mermaid-render-7 .node .label{text-align:center;}#mermaid-render-7 .node.clickable{cursor:pointer;}#mermaid-render-7 .arrowheadPath{fill:#333333;}#mermaid-render-7 .edgePath .path{stroke:#333333;stroke-width:2.0px;}#mermaid-render-7 .flowchart-link{stroke:#333333;fill:none;}#mermaid-render-7 .edgeLabel{background-color:rgba(232,232,232, 0.8);text-align:center;}#mermaid-render-7 .edgeLabel p{margin:0;padding:0;display:inline;}#mermaid-render-7 .edgeLabel rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#mermaid-render-7 .labelBkg{background-color:rgba(232,232,232, 0.8);}#mermaid-render-7 .node .cluster{fill:rgba(255, 255, 222, 0.5);stroke:rgba(170, 170, 51, 0.2);box-shadow:rgba(50, 50, 93, 0.25) 0px 13px 27px -5px,rgba(0, 0, 0, 0.3) 0px 8px 16px -8px;stroke-width:1px;}#mermaid-render-7 .cluster text{fill:#333;}#mermaid-render-7 .cluster span,#mermaid-render-7 p{color:#333;}#mermaid-render-7 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#mermaid-render-7 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#mermaid-render-7 .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#mermaid-render-7 .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#mermaid-render-7 .node .neo-node{stroke:#9370DB;}#mermaid-render-7 [data-look="neo"].node rect,#mermaid-render-7 [data-look="neo"].cluster rect,#mermaid-render-7 [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#mermaid-render-7 [data-look="neo"].swimlane.cluster rect{filter:none;}#mermaid-render-7 [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#mermaid-render-7 [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m