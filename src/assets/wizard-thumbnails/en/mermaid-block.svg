<svg id="mermaid-render-8" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 218px;" viewBox="-5 -27 218 54" role="graphics-document document" aria-roledescription="block"><style>#mermaid-render-8{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#mermaid-render-8 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#mermaid-render-8 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#mermaid-render-8 .error-icon{fill:#552222;}#mermaid-render-8 .error-text{fill:#552222;stroke:#552222;}#mermaid-render-8 .edge-thickness-normal{stroke-width:1px;}#mermaid-render-8 .edge-thickness-thick{stroke-width:3.5px;}#mermaid-render-8 .edge-pattern-solid{stroke-dasharray:0;}#mermaid-render-8 .edge-thickness-invisible{stroke-width:0;fill:none;}#mermaid-render-8 .edge-pattern-dashed{stroke-dasharray:3;}#mermaid-render-8 .edge-pattern-dotted{stroke-dasharray:2;}#mermaid-render-8 .marker{fill:#333333;stroke:#333333;}#mermaid-render-8 .marker.cross{stroke:#333333;}#mermaid-render-8 svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#mermaid-render-8 p{margin:0;}#mermaid-render-8 .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#mermaid-render-8 .cluster-label text{fill:#333;}#mermaid-render-8 .cluster-label span,#mermaid-render-8 p{color:#333;}#mermaid-render-8 .label text,#mermaid-render-8 span,#mermaid-render-8 p{fill:#333;color:#333;}#mermaid-render-8 .node rect,#mermaid-render-8 .node circle,#mermaid-render-8 .node ellipse,#mermaid-render-8 .node polygon,#mermaid-render-8 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#mermaid-render-8 .flowchart-label text{text-anchor:middle;}#mermaid-render